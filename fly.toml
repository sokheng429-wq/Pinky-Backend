# fly.toml app configuration file generated for pinky-backend on 2026-07-25T06:48:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pinky-backend'
primary_region = 'ams'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 8082
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
