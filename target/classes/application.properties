# =====================================================================
# Pinky backend - default configuration (H2 in-memory database)
# Run with: mvn spring-boot:run
# H2 console (optional, for debugging): http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:pinkydb, user: sa, password: (empty)
# =====================================================================

spring.application.name=pinky-backend
server.port=${PORT:8082}

# ---- Neon PostgreSQL database ----
# Replace these defaults with your own Neon connection values or set the
# SPRING_DATASOURCE_* environment variables instead of committing secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-square-frost-aozo71zl-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_8ti3ghCfDUBN}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25

spring.h2.console.enabled=false

# ---- Request size (product images are sent as base64 JSON, can be a few MB) ----
server.tomcat.max-http-form-post-size=60MB
server.tomcat.max-swallow-size=60MB

# =====================================================================
# ---- MySQL alternative (commented out) ----
# Uncomment these lines (and comment out the Neon Postgres block above) to use a
# real MySQL database instead. Also switch the H2 dependency scope /
# add the mysql driver in pom.xml if you removed it.
#
# spring.datasource.url=jdbc:mysql://localhost:3306/pinkydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
# =====================================================================

# ---- JWT ----
# HMAC-SHA256 secret. In production, set this via an environment variable
# (e.g. JWT_SECRET) instead of committing it to source control.
app.jwt.secret=${JWT_SECRET:pinky-super-secret-key-change-me-in-production-0123456789abcdef}
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=https://pinky.sokheng429.workers.dev
